name: Deploy via SSH to Server

on:
  push:
    branches:
      - develop
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BRANCH_NAME
          script: |
            set -eu

            # Dynamic mapping based on the branch
            if [ "$BRANCH_NAME" = "master" ]; then
              ENV_LABEL="PRODUCTION"
              DEPLOY_DIR="/var/www/deploy-test/prod"
              ENV_FILE=".env.prod"
              COMPOSE_PROJECT="prod-deploy-test"
            else
              ENV_LABEL="STAGE"
              DEPLOY_DIR="/var/www/deploy-test/stage"
              ENV_FILE=".env.dev"
              COMPOSE_PROJECT="stage-deploy-test"
            fi

            echo "Updating $ENV_LABEL environment ($BRANCH_NAME)..."
            cd "$DEPLOY_DIR"
           
            # 1. Copy the specific environment file to the standard .env file read by Docker
            if [ -f "$ENV_FILE" ]; then
              cp "$ENV_FILE" .env
              echo "File .env generated by copying $ENV_FILE."
            else
              echo "Error: The configuration file $ENV_FILE does not exist on the server in $DEPLOY_DIR!" >&2
              exit 1
            fi
            
            # 2. Update the source code
            git pull --ff-only origin "$BRANCH_NAME"
            
            # 3. Restart the containers with the updated configuration
            docker compose -p "$COMPOSE_PROJECT" --env-file "$ENV_FILE" pull
            docker compose -p "$COMPOSE_PROJECT" --env-file "$ENV_FILE" up -d --remove-orphans